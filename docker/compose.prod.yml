# Producción en eike-vm (e2-micro, 1 GB RAM). Se levanta con:
#   docker compose -f docker/compose.prod.yml pull
#   docker compose -f docker/compose.prod.yml up -d
# Variables en /opt/eike/.env (no se commitea — ver .env.example).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eike
      POSTGRES_USER: eike
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Asuncion
      PGTZ: America/Asuncion
    # shared_buffers acotado: con Next + Caddy + Postgres en 1 GB de RAM,
    # el valor por defecto de Postgres (128MB) ya es razonable, pero lo
    # fijamos explícito para no depender de detección automática de RAM.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eike"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: us-central1-docker.pkg.dev/eike-503422/eike/web:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://eike:${POSTGRES_PASSWORD}@db:5432/eike
      SESSION_SECRET: ${SESSION_SECRET}
      UPLOADS_DIR: /app/uploads
      SITE_URL: ${SITE_URL}
      # ${VAR:-false}, no ${VAR}: si .env no define COOKIE_SECURE todavía
      # (antes del cutover) esto tiene que salir false, no vacío/undefined
      # — un string vacío en process.env.COOKIE_SECURE no es "false".
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MANTENIMIENTO_TOKEN: ${MANTENIMIENTO_TOKEN}
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - uploads:/app/uploads

  # Barrido de reservas vencidas (Fase 3 del plan de mejoras). Un loop de
  # shell y no un cron daemon a propósito: un contenedor menos pesado en una
  # VM de 1 GB de RAM, y no hay nada más que programar acá todavía.
  sweeper:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - web
    environment:
      MANTENIMIENTO_TOKEN: ${MANTENIMIENTO_TOKEN}
    entrypoint: >
      /bin/sh -c '
        while true; do
          curl -fsS -X POST -H "Authorization: Bearer $$MANTENIMIENTO_TOKEN" http://web:3000/api/mantenimiento/barrer || true;
          sleep 60;
        done
      '

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      # Solo 80 acá en el repo: mientras se prueba por IP (Fase 7) el
      # Caddyfile no tiene ningún site que necesite TLS, así que nada
      # escucha adentro en 443 — publicar ese puerto igual hacía que Docker
      # aceptara la conexión TCP y la cerrara a mitad del handshake
      # (ERR_CONNECTION_CLOSED en el navegador, en vez de un connection
      # refused prolijo). activar-dominio.sh agrega la línea "443:443" acá
      # mismo (con sed) en el cutover — este archivo en la VM ya la tiene.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
