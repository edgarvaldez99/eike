# Entorno de desarrollo local. La app (Next.js) NO corre acá adentro —
# se corre con `pnpm dev` en el host, apuntando a este Postgres.
# Ver docs/03-hosting.md y el plan de migración para el compose de producción
# (docker/compose.prod.yml, Fase 7), que sí incluye la app + Caddy.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eike
      POSTGRES_USER: eike
      POSTGRES_PASSWORD: eike_local
      TZ: America/Asuncion
      PGTZ: America/Asuncion
    ports:
      - "5433:5432" # 5433 en el host para no chocar con un Postgres local
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eike"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8082:8080"

volumes:
  db_data:
