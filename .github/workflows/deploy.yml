name: Build y deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: us-central1-docker.pkg.dev/eike-503422/eike/web

permissions:
  contents: read
  id-token: write # obligatorio para Workload Identity Federation

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: eike-503422
          workload_identity_provider: projects/414425602847/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: eike-gh-deploy@eike-503422.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker contra Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en eike-vm por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ghdeploy
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/eike
            set -a; . ./.env; set +a
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml run --rm \
              -e DATABASE_URL=postgres://eike:${POSTGRES_PASSWORD}@db:5432/eike \
              web npx drizzle-kit migrate
            docker compose -f compose.prod.yml up -d
            docker image prune -af --filter "until=168h"
